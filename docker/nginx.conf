worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # No redefino los *_temp_path: la imagen oficial ya los compila bajo
    # /var/cache/nginx (client_temp, proxy_temp, fastcgi_temp, ...), que es
    # justo el directorio que docker-compose.prod.yml monta como tmpfs.

    sendfile        on;
    keepalive_timeout  65;

    # Limito por IP de origen (no por conexion): un cliente con varias
    # conexiones abiertas sigue contando contra el mismo balde de tokens.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=metrics_limit:10m rate=10r/s;

    # Cabeceras de seguridad para toda respuesta que pasa por el proxy,
    # incluidas las de error (always) -- si no, un 4xx/5xx las pierde.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Resolver embebido de Docker: uso una variable en proxy_pass (en vez de
    # un literal `http://serving:8001`) para que nginx resuelva "serving" en
    # cada request via este resolver, no una sola vez al arrancar/recargar.
    # Con el literal, si nginx arranca (o si `nginx -t` corre) antes de que
    # el contenedor `serving` exista en la red, falla con "host not found in
    # upstream" -- con la variable, un `depends_on` sin healthcheck listo
    # todavia, o un restart de `serving` con otra IP, no tumban el proxy.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        # /metrics tiene su propio limite, mas estricto que el resto de la
        # API: Prometheus lo scrapea directo por la red interna (ver
        # docker/prometheus.yml, target serving:8001), asi que el trafico
        # que entra por ACA es acceso externo/manual, no el scraping normal.
        location /metrics {
            limit_req zone=metrics_limit burst=5 nodelay;

            set $upstream_serving http://serving:8001;
            proxy_pass $upstream_serving;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=api_limit burst=20 nodelay;

            set $upstream_serving http://serving:8001;
            proxy_pass $upstream_serving;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
