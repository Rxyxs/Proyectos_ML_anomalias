name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: pip install ruff

      - name: "Lint (solo errores reales: sintaxis y nombres indefinidos)"
        run: ruff check . --select=E9,F63,F7,F82

  pytest:
    runs-on: ubuntu-latest

    # Las pruebas corren con datos sintéticos y no descargan PaySim, así que no hacen falta
    # credenciales de Kaggle ni los 493 MB del dataset. Es lo que las vuelve viables en CI.
    strategy:
      fail-fast: false
      matrix:
        # 3.10 es la versión con la que se desarrolló; 3.12 verifica que el código siga
        # funcionando con las versiones nuevas de pandas, numpy y scikit-learn.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # La rueda de CPU de PyTorch pesa una fracción de la versión con CUDA, que en un
          # runner sin GPU sería descarga pura sin ningún uso.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Correr las pruebas
        run: pytest tests/ -q --durations=10

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Compilar
        run: go build ./...

      - name: Correr las pruebas (incluye el chequeo de memoria constante)
        run: go test -v ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que la imagen del streamer compila
        run: docker build -t bank-anomaly-streamer ./go

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Este job sí tiene Docker (a diferencia del runner de `pytest`), asi
      # que test_container_security.py corre acá de verdad -- construye la
      # imagen del serving, levanta un contenedor y comprueba en vivo el
      # UID no-root y el HEALTHCHECK, no solo la estructura del Dockerfile.
      - name: Instalar dependencias del test de seguridad del contenedor
        run: pip install pytest PyYAML

      - name: Construir y validar el contenedor del serving (usuario no-root, healthcheck)
        run: pytest tests/test_container_security.py -v
