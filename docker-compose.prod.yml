# Variante de produccion de docker-compose.yml: mismos dos servicios, pero
# con limites de recursos, "no-new-privileges" y una red propia en vez de
# compartir nombres con la version de desarrollo.
services:
  serving:
    build:
      context: .
      dockerfile: Dockerfile
    image: anomaly-detector-serving:prod
    container_name: anomaly-serving-prod
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    # Sin `ports`: ya no se expone directo al host -- la unica entrada
    # externa es el proxy (abajo), que es quien aplica rate limiting y
    # cabeceras de seguridad antes de llegar aca.
    networks:
      - monitoring_net

  proxy:
    image: nginx:alpine-slim
    container_name: anomaly-proxy-prod
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - monitoring_net
    depends_on:
      - serving

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: anomaly-prometheus-prod
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - metrics-data:/prometheus
    networks:
      - monitoring_net
    depends_on:
      - serving

networks:
  monitoring_net:
    driver: bridge

volumes:
  metrics-data:
